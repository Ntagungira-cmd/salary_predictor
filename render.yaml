# Exported as Blueprint / Render Web Service
# Open Render → New → Blueprint, or create a Web Service manually using these values.

services:
  - type: web
    name: tech-salary-predictor-api
    runtime: python
    plan: free
    rootDir: API
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn prediction:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
